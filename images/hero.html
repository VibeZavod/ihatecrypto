<!doctype html>
<!-- The README's top picture in the manner of the site's link previews: the slogan, the app window (app-<theme>.png, a
     screenshot of the canvas) and the manifesto's 3D things and coins around it. hero-light.png and hero-dark.png, 1600x1280:
       python3 -m http.server 8765   (from the repo root)
       screenshot http://127.0.0.1:8765/images/hero.html and ?theme=dark at 1600x1280 -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'DynaPuff'; font-weight: 600; src: url(../App/Tools/site/fonts/dynapuff-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Onest'; font-weight: 400 800; src: url(../App/Tools/site/fonts/onest-latin.woff2) format('woff2'); }
  :root { --bg: #FAFAFB; --dot: #D9DCE2; --ink: #111111; --line: #E1E4EC; --bar: #F4F5F7; --muted: #5F636B; --shadow: rgba(17,17,17,.20); }
  .dark { --bg: #0F1012; --dot: #26282D; --ink: #F4F4F5; --line: #2A2C31; --bar: #1B1C1F; --muted: #9A9DA4; --shadow: rgba(0,0,0,.6); }
  * { box-sizing: border-box; margin: 0; }
  body { position: relative; width: 1600px; height: 1280px; overflow: hidden; color: var(--ink); font-family: Onest, sans-serif; -webkit-font-smoothing: antialiased;
         background: var(--bg) radial-gradient(var(--dot) 1.8px, transparent 2.2px) 0 0 / 32px 32px; }
  .lock { position: absolute; left: 50%; top: 52px; translate: -50% 0; display: flex; align-items: center; gap: 14px; }
  .lock svg { width: 64px; height: 64px; }
  .lock b { font: 600 44px/1 DynaPuff, Onest, sans-serif; letter-spacing: -.3px; }
  h1 { position: absolute; left: 0; right: 0; top: 142px; text-align: center; font: 800 100px/1 Onest, sans-serif; letter-spacing: -.045em; }
  p { position: absolute; left: 0; right: 0; top: 268px; text-align: center; font: 700 40px/1.15 Onest, sans-serif; letter-spacing: -.025em; color: var(--muted); }
  .ring { position: relative; margin-left: .2em; white-space: nowrap; color: var(--ink); }
  .ring svg { position: absolute; left: -.45em; top: -.42em; width: calc(100% + .9em); height: 1.9em; overflow: visible; }
  .ring path { fill: none; stroke: #FF7A2F; stroke-width: 3.5; stroke-linecap: round; }
  .win { position: absolute; left: 210px; top: 372px; width: 1180px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
         background: var(--bar); box-shadow: 0 50px 100px -20px var(--shadow), 0 20px 40px -20px var(--shadow); }
  .bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .bar i { width: 13px; height: 13px; border-radius: 50%; }
  .win img { display: block; width: calc(100% + 24px); margin: -12px 0 0; }
  .obj { position: absolute; display: block; filter: drop-shadow(0 18px 24px var(--shadow)); }
  .coin { border-radius: 50%; }
</style></head><body>

</body></html>
