# The Swift core (wallet, chains, protocols, Guard, execution, models) built and tested on Windows.
# Runs on pushes to the `windows` branch only: the Mac app is built and released from a Mac (release.sh).
name: Windows core

on:
  push:
    branches: [windows]
  workflow_dispatch:

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v7.0.1
      # The same compiler as Xcode on the Mac.
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
          cache: true
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
