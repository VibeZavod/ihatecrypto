# ihatecrypto.app with its signing process. `xcodegen` here, then build with xcodebuild (see ../build-app.sh).
# The SwiftPM package one level up stays the source of the modules; this project only packages and signs.
name: LALA
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  Lala:
    path: ..
settings:
  configs:
    # Release is what runs with real money: no get-task-allow, so nothing — not even root with SIP on — can attach a
    # debugger to the app or the signer and read the seed from memory. Debug keeps it for Xcode and xctrace.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  base:
    DEVELOPMENT_TEAM: N78L833HCS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LALA:
    type: application
    platform: macOS
    sources: [../Sources/LalaApp]
    # The product (ihatecrypto.app, its name in the Dock, menu bar, notifications and Touch ID) is ihatecrypto; the target
    # and the identifier stay LALA / app.lala.mac, so the Keychain items, Application Support/LALA and the signer keep working.
    dependencies:
      - package: Lala
        product: LalaKit
      - target: LalaSigner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lala.mac
        PRODUCT_NAME: ihatecrypto
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        # The chat's microphone: speech becomes text in the field, which the person reads and sends.
        CODE_SIGN_ENTITLEMENTS: LALA.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "After you click the chat's microphone, ihatecrypto listens and types what you say into the field. Nothing is sent until you send it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "What you say in the chat becomes text in its field, recognized on this Mac when your language's model is installed."
        # A Ledger Nano X, Stax or Flex over Bluetooth (Sources/Wallet/Ledger/BLE.swift).
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "ihatecrypto talks to your Ledger over Bluetooth to read its addresses and ask it to sign. Every signature is approved on the Ledger itself."
  # Sandboxed, no network entitlement: it can only answer the app over XPC and read its own Keychain group.
  # Its Touch ID prompt names it and shows its icon: «ihatecrypto is trying to send 0.18 USDC to 0x060b…9Ff0 on Tempo»
  # with the coin, not «LalaSigner» with a blank bundle's icon. The executable and identifier stay, so its Keychain does.
  LalaSigner:
    type: xpc-service
    platform: macOS
    sources: [../Sources/Signer/Service, ../Sources/LalaApp/Assets.xcassets]
    info:
      path: LalaSigner-Info.plist
      properties:
        # xcodegen writes this plist from here: the name the Touch ID window shows goes here, not in the file.
        CFBundleName: ihatecrypto
        CFBundleDisplayName: ihatecrypto
        XPCService:
          ServiceType: Application
    dependencies:
      - package: Lala
        product: LalaSignerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lala.mac.signer
        PRODUCT_NAME: LalaSigner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: LalaSigner.entitlements
        ENABLE_APP_SANDBOX: YES
