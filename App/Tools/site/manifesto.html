  :root { color-scheme: light; --ink: #111111; --muted: #5F636B; --line: #E1E4EC; --accent: #FF7A2F; --accent-ink: #B8480C; --col: 560px; }

  /* The first screen: the title alone, as big as the screen allows. */

  .mf { max-width: calc(var(--col) + 32px); margin: 0 auto; padding: 0 16px; font: 500 clamp(20px, 14px + 1vw, 25px)/1.42 Onest, sans-serif; letter-spacing: -.015em; }

  /* A word marked by a felt-tip, drawn left to right once its block reaches the middle of the screen. */
  mark { color: inherit; padding: 0 .14em; margin: 0 -.14em; -webkit-box-decoration-break: clone; box-decoration-break: clone;

  /* A word circled, or underlined, by hand: the pen goes round once the block is in the middle. */
  .ring, .ul { position: relative; white-space: nowrap; }

  .ul svg { position: absolute; left: -.08em; bottom: -.3em; width: calc(100% + .16em); height: .42em; overflow: visible; pointer-events: none; }
  .ink path { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 1 1.2; stroke-dashoffset: 1.01; transition: stroke-dashoffset .9s cubic-bezier(.45,.1,.25,1) .2s; }

  .lit .ul path { transition-delay: .6s; }

  /* One sentence that comes up word by word. */
  .js .rise .w { display: inline-block; opacity: 0; translate: 0 .5em; transition: opacity .45s ease-out, translate .5s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i) * 75ms + .35s); }
  .js .in.rise .w { opacity: 1; translate: none; }

  /* Logos and little pictures in the line: they pop in as their block comes up. */
  .icons { display: inline-flex; gap: .2em; margin-left: .25em; vertical-align: -.24em; white-space: nowrap; }
  .icons img { display: block; width: 1.15em; height: 1.15em; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(17,17,17,.08); }
  /* a 3D thing the size of the line in place of the full stop, centred on the line (the negative margins keep its height) */
  .em { display: inline-block; width: 1.5em; height: 1.5em; margin: -.3em .1em -.3em .18em; vertical-align: middle; }

  .nw { white-space: nowrap; }
  .js .icons img, .js .em img { scale: 0; transition: scale .55s cubic-bezier(.3,1.8,.5,1); transition-delay: calc(var(--i, 0) * 150ms + .45s); }

  /* press one and it hops (the pictures beside the text too) */
  .icons img, .em img, .pop svg, .dial .obj, .side .sheet, .side .note, .plan .you, .plan li, .ask .re svg, .end .coin { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .pop { display: inline-block; width: 1.75em; height: 1.75em; margin-left: .2em; vertical-align: -.55em; }
  .pop svg { display: block; width: 100%; height: 100%; }
  .js .pop svg { scale: 0; rotate: -45deg; transition: scale .6s cubic-bezier(.3,1.8,.5,1) .45s, rotate .7s cubic-bezier(.3,1.6,.5,1) .45s; }
  .lit .pop svg { scale: 1; rotate: 8deg; }

  .now .pop use { animation: roll 1.6s steps(1) infinite 1.2s; }

  /* A picture beside the circled word: to the right of the column on a wide screen, under the words on a narrow one. */

  .win { position: relative; z-index: 2; padding: 2px; background: #C3C3C3; border: 2px solid; border-color: #FFFFFF #555555 #555555 #FFFFFF; box-shadow: 1px 1px 0 #111111, 0 18px 36px rgba(17,17,17,.16); color: #111111; }
  .win .tb { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 3px 3px 6px; background: linear-gradient(90deg, #000A7B, #1084D0); color: #FFFFFF; font-weight: 700; }
  .win .tb i { width: 16px; height: 14px; flex: none; display: grid; place-items: center; background: #C3C3C3; color: #111111; font: 700 10px/1 Tahoma, sans-serif; border: 1px solid; border-color: #FFFFFF #555555 #555555 #FFFFFF; }
  .win .bd { display: grid; gap: 8px; padding: 12px 10px 10px; }
  .win .pg { height: 16px; padding: 2px; background: #FFFFFF; border: 1px solid; border-color: #555555 #FFFFFF #FFFFFF #555555; }
  .win .pg i { display: block; width: 0; height: 100%; background: repeating-linear-gradient(90deg, #000A7B 0 9px, transparent 9px 11px); }
  .now .win .pg i { animation: dialing 5s steps(14) infinite .3s; }
  @keyframes dialing { to { width: 100%; } }
  .win .bt { justify-self: end; padding: 3px 14px; border: 2px solid; border-color: #FFFFFF #555555 #555555 #FFFFFF; box-shadow: 1px 1px 0 #111111; }
  /* on the left: what you type, the button that waits */
  .side.left { left: auto; right: calc(100% + 40px); rotate: -4deg; }
  .now .side.left { rotate: 2deg; }
  .ask { font: 500 15px/1.35 Onest, sans-serif; }
  .ask .inp { display: flex; align-items: flex-end; gap: 10px; min-height: 60px; padding: 12px 12px 12px 16px; border-radius: 18px; background: #FFFFFF; border: 1.5px solid var(--line); box-shadow: 0 18px 40px rgba(17,17,17,.12); }
  .ask .t { flex: 1; align-self: center; }
  .ask .t::after { content: ''; display: inline-block; width: 2px; height: 1.1em; margin-left: 1px; vertical-align: -.18em; background: var(--accent); animation: caret 1s steps(1) infinite; }
  .ask.sent .t::after { display: none; }
  @keyframes caret { 50% { opacity: 0; } }
  .ask .go { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--ink); }
  .ask.sent .go { animation: press .4s both; }
  .ask .re { display: flex; align-items: center; gap: 8px; margin-top: 12px; opacity: 0; translate: 0 8px; transition: opacity .4s .5s, translate .4s .5s; }
  .ask.sent .re, html:not(.js) .ask .re { opacity: 1; translate: none; }
  .ask .re svg { width: 30px; height: 30px; flex: none; }
  .ask .re span { padding: 8px 12px; border-radius: 14px 14px 14px 4px; background: #FFFFFF; border: 1px solid var(--line); }
  .press .obj { width: 76%; margin: 0 auto; position: relative; z-index: 1; }
  .press::before { content: ''; position: absolute; left: 50%; top: 40%; width: 64%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; }
  .now .press::before { animation: waiting 1.8s ease-out infinite; }
  @keyframes waiting { 0% { opacity: .6; scale: .7; } 100% { opacity: 0; scale: 1.3; } }
  .press .lbl { display: block; width: fit-content; margin: 8px auto 0; padding: 7px 14px; border-radius: 10px; background: var(--ink); color: #FFFFFF; font: 700 14px Onest, sans-serif; }
  /* the wheel turns as it comes in */
  .wheel .obj { rotate: -16deg; transition: rotate 1.6s cubic-bezier(.3,1.3,.4,1) .1s; }
  .now .wheel .obj { rotate: 6deg; }
  @media (max-width: 1199px) {
    .side, .side.left { position: relative; left: auto; right: auto; top: auto; width: auto; max-width: 320px; margin: 40px auto 0; translate: none; }
    .wheel { max-width: 240px; }
  }

  /* The end: one line, the coin happy, the download. */
  .end { display: flex; flex-direction: column; align-items: center; text-align: center; padding: clamp(64px, 17vh, 152px) 16px 96px; }
  .end .coin { width: 96px; height: 96px; }
  .end h2 { max-width: 16ch; margin-top: 22px; font: 800 clamp(38px, 6vw, 84px)/1.02 Onest, sans-serif; letter-spacing: -.04em; text-wrap: balance; }
  .end .btn { margin-top: 34px; height: 54px; font-size: 16px; }
  .js .end > * { opacity: 0; translate: 0 22px; transition: opacity .8s ease-out, translate .8s cubic-bezier(.2,.7,.2,1); }
  .js .end > h2 { transition-delay: .15s; } .js .end > :nth-child(n+3) { transition-delay: .4s; }
  .js .end .coin { scale: 0; rotate: -40deg; transition: scale .6s cubic-bezier(.3,1.8,.5,1), rotate .7s cubic-bezier(.3,1.6,.5,1), opacity .3s; }
  .js .end.in > * { opacity: 1; translate: none; scale: 1; rotate: 0deg; }
  footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 16px 44px; }

  /* Blocks come up as they scroll in. */
  .js .hero > *, .js .mf > * { opacity: 0; translate: 0 22px; transition: opacity .9s ease-out, translate .9s cubic-bezier(.2,.7,.2,1); }
  .js .hero > p { transition-delay: .4s; }
  .js .hero.in > *, .js .mf > .in { opacity: 1; translate: none; }

  @media (max-width: 760px) {
    .nav { display: none; }

  @media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; animation: none !important; } }

<template lang="en">
<section class="hero"><h1>I hate crypto.</h1><p>Not the money. <mark>Managing it</mark>.</p></section>
<article class="mf">
  <div class="has-side"><p>In 2008, <span class="ring">Satoshi Nakamoto</span> promised us <mark>money without middlemen</mark>. Our own. Sent straight from one person to another.</p><figure class="side" data-fig="paper" aria-hidden="true"></figure></div>
  <p>And for a while, it felt that way. Bitcoin. Stablecoins. DeFi. Stocks on a blockchain. Money that <mark>never closes for the weekend</mark><span class="icons" data-i="btc.svg eth.svg usdc.png sol.png hype.svg aave.svg tsla.png"></span></p>
  <p class="rise">But year after year, managing it is the same as on day one.</p>
  <p>Copy an address and check the first and last four characters<span class="em" data-i="clipboard"></span> Find a bridge<span class="em" data-i="bridge"></span> Wait<span class="em" data-i="hourglass"></span> Land on a new chain with no gas<span class="em" data-i="gaspump"></span> Sign a transaction <mark>that makes no sense</mark><span class="em" data-i="pen"></span></p>
  <p>We write code with AI<span class="em" data-i="laptop"></span> We search with AI<span class="em" data-i="magnifier"></span> We learn with AI<span class="em" data-i="gradcap"></span> And crypto? We still <mark>move it by hand</mark>: step by step, signature by signature.</p>
  <div class="has-side"><p>When you can simply tell crypto what you want, it <mark>stops being work</mark><span class="em" data-i="coffee"></span> No more checking addresses. No more hunting for a bridge. And no more signing what you don’t understand.</p>
    <figure class="side left ask" aria-hidden="true"><div class="inp"><span class="t">move my USDC from Base to Solana</span><i class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></i></div><div class="re"><svg viewBox="0 0 140 140"><use href="#f-think"/></svg><span>Building the route…</span></div></figure></div>
  <p>We’re told agents will soon manage money on their own. Maybe. But let’s be honest: today you won’t trust one with <mark>serious capital</mark>.</p>
  <div class="has-side"><p>We believe AI in crypto has a different job right now: not to decide for you, but to show every step and <mark>wait for your Confirm</mark>.</p>
    <figure class="side left press" aria-hidden="true"><img class="obj" src="/mf/button.webp" alt=""><span class="lbl" data-done="✓ Done">Confirm</span></figure></div>
  <p class="indent">That’s how <span class="ul">ihatecrypto</span> began<span class="pop"></span></p>
  <p>An infinite canvas like Figma<span class="em" data-i="canvas"></span> Your LLM subscription as the brain<span class="em" data-i="chat"></span> And a wallet that understands you<span class="em" data-i="wallet"></span></p>
  <div class="has-side"><p>You write one message. A <span class="ring">plan</span> appears on the canvas: every step, every chain, what you have now and what you’ll have after. You press Confirm, and <mark>in under a minute</mark> it’s done.</p>
    <figure class="side plan" aria-hidden="true"><div class="you">Move my pay to Solana, buy Tesla and SOL, lend the rest</div><div class="card"><div class="ph">Plan · 8 steps · 3 chains</div><ol><li><img src="/mf/usdc.png" alt="">Move to Solana</li><li><img src="/mf/tsla.png" alt="">Buy Tesla</li><li><img src="/mf/sol.png" alt="">Buy SOL</li><li><img src="/mf/jup.png" alt="">Lend the rest</li></ol><div class="go"><span class="c">Confirm</span><span class="d">Done in 55 s</span></div></div></figure></div>
  <p>The keys stay on your Mac. The brain is your own AI subscription. The last word is always yours.</p>
  <p>What will you ask for first? <strong>Honestly, we don’t know.</strong> Maybe a bridge. Maybe Tesla stock. Maybe a deposit, or a trade with a stop. The only limit is <mark>your imagination</mark>.</p>
  <div class="has-side"><p>But we do know this. One day we’ll look back on manual bridges and checking addresses the way we look back on the <span class="ring">modem</span> that screeched before letting us online. Back then it worked. And that was fine.</p>
    <figure class="side dial" aria-hidden="true"><img class="obj" src="/mf/modem.webp" alt=""><div class="win"><div class="tb"><span>Dial-Up Networking</span><i>✕</i></div><div class="bd"><p>Dialing…</p><div class="pg"><i></i></div><p>Connecting at 56,000 bps</p><span class="bt">Cancel</span></div></div></figure></div>
  <div class="has-side"><p>One day agents will manage money on their own. But autopilot didn’t arrive overnight: first, cars learned to <span class="ring">keep their lane</span> while your hands stayed on the wheel.</p>
    <figure class="side wheel" aria-hidden="true"><img class="obj" src="/mf/wheel.webp" alt=""></figure></div>
  <p>ihatecrypto is <span class="ul">your hands on the wheel</span>. The first step between today and AGI.</p>
  <p class="sign">— <a class="ul" href="https://x.com/0xMaxiMaxi" target="_blank" rel="noopener">Max</a>, founder</p>
</article>
<section class="end">
  <svg class="coin" viewBox="0 0 140 140" aria-hidden="true"><use href="#f-done"/></svg>

<template lang="es">
<section class="hero"><h1>Odio la cripto.</h1><p>No el dinero. <mark>Gestionarlo</mark>.</p></section>
<article class="mf">
  <div class="has-side"><p>En 2008, <span class="ring">Satoshi Nakamoto</span> nos prometió <mark>dinero sin intermediarios</mark>: dinero propio, que pasa directamente de una persona a otra.</p><figure class="side" data-fig="paper" aria-hidden="true"></figure></div>
  <p>Y durante un tiempo pareció que así era. Bitcoin. Stablecoins. DeFi. Acciones en la blockchain. Dinero que <mark>no descansa ni los fines de semana</mark><span class="icons" data-i="btc.svg eth.svg usdc.png sol.png hype.svg aave.svg tsla.png"></span></p>
  <p class="rise">Pero año tras año, gestionarlo sigue siendo igual que el primer día.</p>
  <p>Copiar una dirección y comprobar los cuatro primeros y los cuatro últimos caracteres<span class="em" data-i="clipboard"></span> Buscar un puente<span class="em" data-i="bridge"></span> Esperar<span class="em" data-i="hourglass"></span> Llegar a una red nueva sin gas<span class="em" data-i="gaspump"></span> Firmar una transacción <mark>que no se entiende</mark><span class="em" data-i="pen"></span></p>
  <p>Escribimos código con IA<span class="em" data-i="laptop"></span> Buscamos con IA<span class="em" data-i="magnifier"></span> Aprendemos con IA<span class="em" data-i="gradcap"></span> ¿Y la cripto? La seguimos <mark>moviendo a mano</mark>: paso a paso, firma a firma.</p>
  <div class="has-side"><p>Cuando basta con decir lo que quieres, la cripto <mark>deja de ser un trabajo</mark><span class="em" data-i="coffee"></span> Ya no hay que comprobar direcciones. Ni buscar puentes. Ni firmar lo que no entiendes.</p>
    <figure class="side left ask" aria-hidden="true"><div class="inp"><span class="t">pasa mis USDC de Base a Solana</span><i class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></i></div><div class="re"><svg viewBox="0 0 140 140"><use href="#f-think"/></svg><span>Preparando la ruta…</span></div></figure></div>
  <p>Nos dicen que pronto los agentes gestionarán el dinero solos. Puede ser. Pero seamos sinceros: hoy no le confiarías a un agente <mark>una suma importante</mark>.</p>
  <div class="has-side"><p>Creemos que, por ahora, la IA tiene otro papel en la cripto: no decidir por ti, sino mostrarte cada paso y <mark>esperar a que pulses Confirm</mark>.</p>
    <figure class="side left press" aria-hidden="true"><img class="obj" src="/mf/button.webp" alt=""><span class="lbl" data-done="✓ Hecho">Confirm</span></figure></div>
  <p class="indent">Así nació <span class="ul">ihatecrypto</span><span class="pop"></span></p>
  <p>Un lienzo infinito como el de Figma<span class="em" data-i="canvas"></span> Tu suscripción de LLM como cerebro<span class="em" data-i="chat"></span> Y una billetera que te entiende<span class="em" data-i="wallet"></span></p>

<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const lang = document.documentElement.lang;

// The pen strokes, the coin, the pictures in the line and the whitepaper's first page: put where the words ask.

  + '<p><b>Abstract.</b> A purely peer-to-peer version of electronic cash would allow online payments to be sent <mark>directly from one party to another</mark> without going through a financial institution.</p><i></i></div><span class="note">31.10.2008</span>';
$$('.ring').forEach((el) => el.insertAdjacentHTML('beforeend', RING));
$$('.ul').forEach((el) => el.insertAdjacentHTML('beforeend', LINE));
$$('.pop').forEach((el) => { el.innerHTML = COIN; });
$$('.mf > *').forEach((b) => $$('.em', b).forEach((el, i) => { el.innerHTML = `<img src="/mf/${el.dataset.i}.webp" alt="">`; el.style.setProperty('--i', i); }));
// a picture in the line never starts a line alone: it is tied to the word before it (a marked word stays marked)
$$('.em, .icons, .pop').forEach((el) => {
  const box = document.createElement('span');
  box.className = 'nw';
  let prev = el.previousSibling, word;
  if (prev && prev.nodeName === 'MARK' && prev.lastChild?.nodeType === 3) {
    const t = prev.lastChild, k = Math.max(t.data.lastIndexOf(' '), t.data.lastIndexOf('\u00a0')) + 1;
    word = document.createElement('mark');
    word.textContent = t.data.slice(k);
    t.data = t.data.slice(0, k);
    if (!prev.textContent) prev.remove();
  } else if (prev && prev.nodeType === 1) word = prev;   // a circled or underlined word: already one piece
  else if (prev && prev.nodeType === 3) {
    const k = Math.max(prev.data.lastIndexOf(' '), prev.data.lastIndexOf('\u00a0')) + 1;
    word = document.createTextNode(prev.data.slice(k));
    prev.data = prev.data.slice(0, k);
  } else return;
  el.replaceWith(box);
  box.append(word, el);
});
$$('.icons').forEach((el) => { el.innerHTML = el.dataset.i.split(' ').map((f, i) => `<img src="/mf/${f}" alt="" style="--i:${i}">`).join(''); });
$$('[data-fig=paper]').forEach((el) => { el.innerHTML = PAPER; });
// a paragraph's last two words stay on one line: no word alone at its end
$$('.mf p, .hero p, .end h2').forEach((p) => {
  const walk = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  let last = null;
  while (walk.nextNode()) if (/ \S/.test(walk.currentNode.data)) last = walk.currentNode;
  if (last) last.data = last.data.replace(/ (?=\S+\s*$)/, '\u00a0');
});
// the sentence that comes up word by word (a no-break space keeps its two words together)
$$('.rise').forEach((el) => {
  const words = el.textContent.split(' ');
  el.textContent = '';
  words.forEach((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.style.setProperty('--i', i); s.textContent = w; el.append(s, ' '); });

// Every picture hops when pressed; the buttons in the pictures beside the text do what they say.
addEventListener('click', (e) => {
  const hop = e.target.closest('.icons img, .em img, .pop svg, .dial .obj, .side .sheet, .side .note, .plan .you, .plan li, .ask .re svg, .end .coin');
  if (hop) { hop.classList.remove('hop'); void hop.offsetWidth; hop.classList.add('hop'); return; }   // offsetWidth: a second press hops again
  const press = e.target.closest('.press .obj, .press .lbl')?.closest('.press');
  if (press) {
    const lbl = press.querySelector('.lbl');
    press.classList.remove('pressed'); void press.offsetWidth; press.classList.add('pressed');

addEventListener('animationend', (e) => { e.target.classList?.remove('hop'); if (e.animationName === 'spin') e.target.closest('.wheel')?.classList.remove('spin'); });

// The message in the left picture types itself, then it is sent and the coin answers; pressing send types it again.
function type(el, again) {
  if (el.dataset.typed && !again) return;
  el.dataset.typed = 1;
  const words = el.dataset.words ??= el.textContent;
  let k = 0;
  el.textContent = '';
  clearInterval(el.t);
  el.t = setInterval(() => { el.textContent = words.slice(0, ++k); if (k >= words.length) { clearInterval(el.t); el.closest('.ask').classList.add('sent'); } }, 55);
}

// Each block: «in» once it scrolls in (it comes up), «lit» once it reaches the middle of the screen (its marks, the pen,
// the pictures stay drawn), «now» while it is there (its picture beside it, the coin's eyes).
const blocks = [$('.hero'), ...$$('.mf > *'), $('.end')];
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { blocks.forEach((el) => el.classList.add('in', 'lit', 'now')); $$('.ask').forEach((el) => el.classList.add('sent')); }
else {
  const show = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); show.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  const mid = new IntersectionObserver((es) => es.forEach((e) => {
    e.target.classList.toggle('now', e.isIntersecting);
    if (e.isIntersecting) { e.target.classList.add('lit'); $$('.ask .t', e.target).forEach((t) => type(t)); }
  }), { rootMargin: '-36% 0px -36% 0px' });
  blocks.forEach((el) => { show.observe(el); mid.observe(el); });
}

const langOpen = (b) => { langMenu.hidden = !b; langBtn.setAttribute('aria-expanded', b); };

addEventListener('click', (e) => { if (!e.target.closest('.lang')) langOpen(false); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !langMenu.hidden) { langOpen(false); langBtn.focus(); } });
$$('.lang-menu a').forEach((a) => {
  a.setAttribute('aria-checked', a.hreflang === lang);
  a.addEventListener('click', () => { try { localStorage.setItem('lang', a.hreflang); } catch (e) {} });
});

// Off a Mac the link travels to one: the share sheet, or the link copied.
const SHARE = 'https://ihatecrypto.ai/?send';
$$('.sendto').forEach((b) => b.addEventListener('click', async () => {
  try { navigator.sendBeacon('/e', JSON.stringify({ n: 'send', l: lang })); } catch (e) {}
  if (navigator.share) { try { await navigator.share({ title: 'ihatecrypto', text: $('meta[name=share]').content, url: SHARE }); } catch (e) {} return; }   // a cancel is fine
  try { await navigator.clipboard.writeText(SHARE); } catch (e) { return; }
  const word = $('span', b), was = word.textContent;
  b.style.minWidth = b.offsetWidth + 'px';
  word.textContent = '✓ ' + ($('.end .sendto').dataset.ok);
  setTimeout(() => { word.textContent = was; }, 1500);
}));
